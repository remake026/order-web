# 生产容器：Nginx 同时负责「托管前端静态文件」和「反代后端接口」

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 10m;

    # 用 Docker 内置 DNS 动态解析 backend，后端容器重建换 IP 后不会 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    # 前端是 history 路由，找不到的路径一律回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反向代理：保留 /api/ 前缀，直接交给 Spring Boot
    location /api/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 图片由 Nginx 直接读宿主机挂载目录，不经过后端，性能更好
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
